
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albeik's Lounge</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .btn { background: #f39c12; color: #121212; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn:hover { background: #e67e22; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 6px; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState("storefront");
            const [clickCount, setClickCount] = React.useState(0);
            
            const [listings, setListings] = React.useState(() => {
                const saved = localStorage.getItem("albeiks_listings");
                if (saved) return JSON.parse(saved);
                return [
                    { id: "1", title: "Archive Flannel Jacket", price: 85, category: "Jackets", size: "L", photo: "https://images.unsplash.com/photo-154883354-7622d03aca27?auto=format&fit=crop&w=800&q=80", description: "Heavyweight boxy cut archive flannel." },
                    { id: "2", title: "Japanese Selvedge Denim", price: 110, category: "Bottoms", size: "W32 L32", photo: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=800&q=80", description: "14oz raw selvedge denim." }
                ];
            });

            const [cart, setCart] = React.useState([]);
            
            // Form states for adding items & checkout
            const [title, setTitle] = React.useState("");
            const [price, setPrice] = React.useState("");
            const [category, setCategory] = React.useState("Jackets");
            const [size, setSize] = React.useState("");
            const [photo, setPhoto] = React.useState("");
            const [description, setDescription] = React.useState("");

            const [custName, setCustName] = React.useState("");
            const [custAddress, setCustAddress] = React.useState("");
            const [custCity, setCustCity] = React.useState("");
            const [custPhone, setCustPhone] = React.useState("");

            React.useEffect(() => {
                localStorage.setItem("albeiks_listings", JSON.stringify(listings));
            }, [listings]);

            // Secret 5-click trigger on the title for admin panel
            const handleTitleClick = () => {
                const newCount = clickCount + 1;
                setClickCount(newCount);
                if (newCount === 5) {
                    const pin = prompt("Enter Admin PIN:");
                    if (pin === "078507") {
                        setView("admin");
                    } else {
                        alert("Incorrect PIN");
                    }
                    setClickCount(0);
                }
            };

            const handleAddListing = (e) => {
                e.preventDefault();
                const newItem = { id: Date.now().toString(), title, price: Number(price), category, size, photo, description };
                setListings([newItem, ...listings]);
                setTitle(""); setPrice(""); setSize(""); setPhoto(""); setDescription("");
                alert("Clothing item added permanently!");
            };

            const handleDelete = (id) => {
                if (confirm("Remove this piece from catalog?")) {
                    setListings(listings.filter(item => item.id !== id));
                }
            };

            const addToCart = (item) => {
                setCart([...cart, item]);
                alert(`Added ${item.title} to your bag!`);
            };

            const handleCheckoutSubmit = (e) => {
                e.preventDefault();
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                alert(`Order placed successfully, ${custName}!\n\nTotal: $${total}\nShipping to: ${custAddress}, ${custCity}\n\nWe have recorded your order details!`);
                setCart([]);
                setView("storefront");
                setCustName(""); setCustAddress(""); setCustCity(""); setCustPhone("");
            };

            return (
                <div>
                    <div className="header">
                        <h1 onClick={handleTitleClick} style={{ cursor: "pointer", userSelect: "none" }} title="Albeik's Lounge">
                            Albeik's Lounge
                        </h1>
                        <div>
                            <button className="btn" onClick={() => setView("cart")}>
                                Bag <span className="badge">{cart.length}</span>
                            </button>
                            {view !== "storefront" && (
                                <button className="btn" style={{ marginLeft: "10px" }} onClick={() => setView("storefront")}>Storefront</button>
                            )}
                        </div>
                    </div>

                    {view === "storefront" && (
                        <div className="grid">
                            {listings.map(item => (
                                <div key={item.id} className="card">
                                    <img src={item.photo} alt={item.title} />
                                    <h3>{item.title}</h3>
                                    <p>${item.price.toFixed(2)} | Size: {item.size}</p>
                                    <p>{item.description}</p>
                                    <button className="btn" style={{ width: "100%" }} onClick={() => addToCart(item)}>Add to Bag</button>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === "cart" && (
                        <div style={{ maxWidth: "600px", margin: "0 auto", background: "#1e1e1e", padding: "20px", borderRadius: "6px" }}>
                            <h2>Your Shopping Bag</h2>
                            {cart.length === 0 ? <p>Your bag is empty.</p> : (
                                <div>
                                    {cart.map((item, index) => (
                                        <div key={index} style={{ display: "flex", justifyContent: "space-between", background: "#2a2a2a", padding: "10px", margin: "10px 0", borderRadius: "4px" }}>
                                            <span>{item.title}</span>
                                            <span>${item.price}</span>
                                        </div>
                                    ))}
                                    <h3>Total: ${cart.reduce((sum, item) => sum + item.price, 0)}</h3>
                                    
                                    <h3 style={{ marginTop: "25px", borderTop: "1px solid #333", paddingTop: "15px" }}>Shipping Details</h3>
                                    <form onSubmit={handleCheckoutSubmit}>
                                        <label>Full Name</label>
                                        <input type="text" value={custName} onChange={e => setCustName(e.target.value)} required />
                                        <label>Street Address</label>
                                        <input type="text" value={custAddress} onChange={e => setCustAddress(e.target.value)} required />
                                        <label>City & Postal Code</label>
                                        <input type="text" value={custCity} onChange={e => setCustCity(e.target.value)} required />
                                        <label>Phone Number</label>
                                        <input type="text" value={custPhone} onChange={e => setCustPhone(e.target.value)} required />
                                        <button type="submit" className="btn" style={{ width: "100%", marginTop: "10px" }}>Complete Order</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    )}

                    {view === "admin" && (
                        <div style={{ maxWidth: "600px", margin: "0 auto", background: "#1e1e1e", padding: "20px", borderRadius: "6px" }}>
                            <h2>Seller Dashboard - Add Clothing</h2>
                            <form onSubmit={handleAddListing}>
                                <label>Title</label>
                                <input type="text" value={title} onChange={e => setTitle(e.target.value)} required />
                                <label>Price ($)</label>
                                <input type="number" value={price} onChange={e => setPrice(e.target.value)} required />
                                <label>Category</label>
                                <select value={category} onChange={e => setCategory(e.target.value)}>
                                    <option value="Jackets">Jackets</option>
                                    <option value="Bottoms">Bottoms</option>
                                    <option value="Tops">Tops</option>
                                    <option value="Accessories">Accessories</option>
                                </select>
                                <label>Size</label>
                                <input type="text" value={size} onChange={e => setSize(e.target.value)} required />
                                <label>Photo URL</label>
                                <input type="text" value={photo} onChange={e => setPhoto(e.target.value)} placeholder="https://..." required />
                                <label>Description</label>
                                <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3"></textarea>
                                <button type="submit" className="btn">Publish Item</button>
                            </form>
                            <h3 style={{ marginTop: "30px" }}>Manage Active Inventory</h3>
                            {listings.map(item => (
                                <div key={item.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#2a2a2a", padding: "10px", margin: "10px 0", borderRadius: "4px" }}>
                                    <span>{item.title} - ${item.price}</span>
                                    <button className="btn" style={{ background: "#e74c3c", color: "#fff" }} onClick={() => handleDelete(item.id)}>Delete</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
